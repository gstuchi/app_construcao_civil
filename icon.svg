<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ícone do Custta (10/2026): o "tt." — os dois t de custta. com o ponto final
       virando pilar, em verde-noite sobre o verde da marca, e o pilar em menta.
       Desenho próprio (haste 40 na malha de 256, pontas redondas, viga de 36, pilar
       de 40 com canto 10); masters, guia e versões em ~/Documents/custta-mockups/logo/kit.
       Sangra até a borda de propósito — o manifest declara purpose "any maskable",
       então quem recorta é o sistema; o desenho cabe no círculo seguro de 80%
       (ponto mais distante a 183px do centro; o limite é 205).
       Os PNGs saem daqui:
         rsvg-convert -w 512 icon.svg  -> icon-512.png
         rsvg-convert -w 192 icon.svg  -> icon-192.png
         rsvg-convert -w 180 icon.svg  -> apple-touch-icon.png
       (achatados em RGB, sem alfa), e o ícone do iOS sai do icon-512.png pelo
       scripts/imagens-ios.mjs. -->
  <defs><linearGradient id="fundo" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#14B39A"/><stop offset="1" stop-color="#0D8577"/></linearGradient></defs>
