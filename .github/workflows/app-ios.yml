name: app-ios
# App nativo em SwiftUI (app-ios/), num macOS 26 (Xcode 26):
# - nucleo: swift test do pacote CusttaNucleo, que confere as regras reescritas em Swift contra os
#   vetores gerados do site (tests/vetores/calc.json); por isso também dispara quando calc.js,
#   dados.js, push.js, cadastro.js ou o gerador mudam;
# - app: compila o app em Release sem assinatura (o caminho do TestFlight) e roda os testes de
#   unidade e de tela no simulador com os serviços falsos;
# - app-etapa3: os testes de tela da etapa 3, num simulador próprio, em paralelo com o app (com eles, o app passou do
#   teto de 75 min);
# - app-etapa3-b: os testes de tela da etapa 3 que não couberam no app-etapa3 (no PR 2, a suíte do detalhe do tópico), no
#   mesmo molde e também em paralelo com o app;
# - app-etapa3-c: os testes de tela do PR 3 da etapa 3, que não couberam no app-etapa3-b, no mesmo molde e também em
#   paralelo com o app;
# - laudo, laudo-parte3, laudo-etapa3 e auditoria: o laudo de leitura sobre o vidro e as auditorias de acessibilidade,
#   cada um num simulador próprio, em paralelo com o app (o app com os dois passava dos 65 min com as telas da etapa 2,
#   os dois num job só chegavam a 75 min com a folha do gasto, a parte 3 da etapa 2 levava o laudo ao teto, e as telas da
#   etapa 3 moram no laudo-etapa3 desde a primeira).
# Os testes contra os emuladores do Firebase e a conferência cruzada com o site rodam no Mac
# (npm run test:app-ios:emuladores e npm run test:app-ios:cruzado): precisam de Java, dos
# emuladores e da assinatura de simulador para o keychain do Firebase Auth.
#
# Por que macos-26 fixo, e não macos-latest: o projeto é do Xcode 16+ (objectVersion 77) e o pacote
# pede Swift 6.2; trocar de imagem tem de ser decisão, não surpresa no meio de um PR. Pelo mesmo motivo
# o Xcode é fixo (DEVELOPER_DIR): o padrão do runner muda sem aviso.
on:
  pull_request:
    paths:
      - 'app-ios/**'
      - 'calc.js'
      - 'dados.js'
      - 'push.js'
      - 'cadastro.js'
      - 'teclado.js'
      - 'scripts/vetores-calc.mjs'
      - 'scripts/simulador-ios.mjs'
      - 'tests/vetores/**'
      - '.github/workflows/app-ios.yml'
  workflow_dispatch:
    inputs:
      resolver_de_novo:
        description: 'Resolver os pacotes Swift do app nativo de novo e mostrar o Package.resolved novo no resumo'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: app-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    if: false  # temporário: o run das sondas roda só o app-etapa3-c
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fica no log: o runner troca de Xcode com o tempo e é a primeira coisa a conferir
      # quando um teste que passava começa a quebrar sozinho.
      - name: Versão do Xcode e do Swift
        run: |
          xcodebuild -version
          swift --version

      - name: Núcleo contra os vetores do site
        env:
          TZ: America/Sao_Paulo
        run: swift test --package-path app-ios/CusttaNucleo

  app:
    if: false  # temporário: o run das sondas roda só o app-etapa3-c
    runs-on: macos-26
    # Sem o laudo e as auditorias (jobs laudo, laudo-parte3, laudo-etapa3 e auditoria) e sem os testes de tela da etapa 3
    # (jobs app-etapa3, app-etapa3-b e app-etapa3-c): ~41 min de testes + ~11 de preparo ≈ 53 min numa VM normal. Numa
    # lenta, 67 min, com 48,9 de testes de tela (run 39799242127): o teto de 75 deixava 8 min de folga, e passa a 90. No
    # fim do PR 2 da etapa 3, 60,2 min, com 46,2 de testes de tela (run 40125911713).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Versão do Xcode
        run: xcodebuild -version

      # Pacotes Swift travados: o build usa só as versões do Package.resolved versionado. Para
      # atualizar, rode este workflow no botão com "resolver de novo", confira repositórios e
      # versões no resumo e versione o arquivo novo junto com a mudança do project.pbxproj.
      - name: Resolver os pacotes Swift de novo
        if: inputs.resolver_de_novo
        run: |
          set -o pipefail
          ARQ=app-ios/Custta.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          rm -f "$ARQ"
          xcodebuild -resolvePackageDependencies -project app-ios/Custta.xcodeproj -scheme Custta
          { echo '### Package.resolved novo (app nativo)'; echo '```json'; cat "$ARQ"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$ARQ"

      # -skipMacroValidation / -skipPackagePluginValidation: em CI não há quem aprove macro ou
      # plugin de pacote, e sem as flags o xcodebuild falha em vez de perguntar.
      # CODE_SIGNING_* zerados: a Release está configurada para o perfil "Custta App Store", e
      # este build prova que ela compila sem segredo nenhum (a assinatura mora no envio).
      - name: Compilar (Release, sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -project app-ios/Custta.xcodeproj \
            -scheme Custta \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath app-ios/build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build

      # Testes com os serviços falsos (nada de rede): unidade e tela. Os que dependem dos emuladores pulam
      # sozinhos aqui; o laudo de leitura e as auditorias de acessibilidade rodam nos jobs laudo e auditoria, e os
      # testes de tela da etapa 3, no app-etapa3, no app-etapa3-b e no app-etapa3-c.
      - name: Testes de unidade e de tela no simulador
        run: |
          set -o pipefail
          DESTINO="$(node scripts/simulador-ios.mjs)"
          echo "Simulador: $DESTINO"
          xcodebuild test \
            -project app-ios/Custta.xcodeproj \
            -scheme Custta \
            -destination "$DESTINO" \
            -derivedDataPath app-ios/build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$RUNNER_TEMP/testes.xcresult" \
            -skip-testing:CusttaUITests/LeituraNoVidroUITests \
            -skip-testing:CusttaUITests/AuditoriaUITests \
            -skip-testing:CusttaUITests/OrcamentoUITests \
            -skip-testing:CusttaUITests/FolhasDeOrigemUITests \
            -skip-testing:CusttaUITests/DetalheDoTopicoUITests \
            -skip-testing:CusttaUITests/BuscaUITests \
            -skip-testing:CusttaUITests/AfazeresUITests \
            CODE_SIGNING_ALLOWED=NO

      # Unidade ou tela reprovadas: o resultado dos testes fica 7 dias no artefato. Também quando o job é cancelado: o run
      # 39710458060 foi cortado no teto e ficou sem xcresult.
      - name: Resultado dos testes quando reprovam ou o job é cortado
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testes-app-ios
          path: ${{ runner.temp }}/testes.xcresult
          retention-days: 7

  app-etapa3:
    if: false  # temporário: o run das sondas roda só o app-etapa3-c
    runs-on: macos-26
    # Os testes de tela da etapa 3, com o preparo do app, sem o build Release e sem o "resolver de novo": com eles, o app
    # passou do teto de 75 min (runs 39693700450 e 39710458060). No PR 1, o OrcamentoUITests; no PR 2, o
    # FolhasDeOrigemUITests. No run 39813469497, FolhasDeOrigem 25,0 + Orçamento 23,4 min, 58,8 com o preparo, numa VM
    # lenta (≈ 51 no run 39799242127). O app, com as mesmas suítes, levou 42 min num run e 67 no outro: cada job pega a
    # sua VM. O teto vai pela mais lenta: 90, como o do app. Como no laudo-etapa3, cada PR da etapa anota aqui o tempo do
    # job; este não cresce mais: a suíte do detalhe do tópico (PR 2) vai para o app-etapa3-b, e as de tela do PR 3, para o
    # app-etapa3-c.
    # No fim do PR 2, FolhasDeOrigem 21,3 + Orçamento 18,7 min e 48,3 com o preparo, numa VM lenta (run 40125911713, com
    # um arrasto perdido do iOS 26); 36,8 no run 40108043199.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Versão do Xcode
        run: xcodebuild -version

      # Os mesmos serviços falsos do job app, que pula estas suítes.
      - name: Testes de tela da etapa 3 no simulador
        run: |
          set -o pipefail
          DESTINO="$(node scripts/simulador-ios.mjs)"
          echo "Simulador: $DESTINO"
          xcodebuild test \
            -project app-ios/Custta.xcodeproj \
            -scheme Custta \
            -destination "$DESTINO" \
            -derivedDataPath app-ios/build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$RUNNER_TEMP/testes-etapa3.xcresult" \
            -only-testing:CusttaUITests/OrcamentoUITests \
            -only-testing:CusttaUITests/FolhasDeOrigemUITests \
            CODE_SIGNING_ALLOWED=NO

      # Tela reprovada: o resultado dos testes fica 7 dias no artefato. Também quando o job é cancelado: o run 39710458060
      # foi cortado no teto e ficou sem xcresult.
      - name: Resultado dos testes da etapa 3 quando reprovam ou o job é cortado
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testes-etapa3-app-ios
          path: ${{ runner.temp }}/testes-etapa3.xcresult
          retention-days: 7

  app-etapa3-b:
    if: false  # temporário: o run das sondas roda só o app-etapa3-c
    runs-on: macos-26
    # Os testes de tela da etapa 3 que não cabem no app-etapa3 (55 min no run 40019534025 e 58,8 numa VM lenta, no
    # 39813469497; com a suíte do detalhe, ~70 a 75): no PR 2, o DetalheDoTopicoUITests. As suítes de tela do PR 3
    # (~22 min de testes no run 39878786962) o levariam a ~50 min e vão para o app-etapa3-c.
    # O mesmo preparo do app-etapa3, em paralelo com ele. No fim do PR 2, 21,8 min no run 40125911713: o detalhe, com 16
    # testes, em 13,4, e o resto é o preparo e o 1º boot (um teste caiu por toque perdido do iOS 26, com os 16 até o fim);
    # 28 min no 40108043199, com 15. Teto de 60, mais que o dobro numa VM lenta; como no app-etapa3, cada PR da etapa anota
    # aqui o tempo do job e, passando de ~50, a suíte nova vai para um job novo.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Versão do Xcode
        run: xcodebuild -version

      # Os mesmos serviços falsos do job app, que pula estas suítes.
      - name: Testes de tela da etapa 3 no simulador (parte b)
        run: |
          set -o pipefail
          DESTINO="$(node scripts/simulador-ios.mjs)"
          echo "Simulador: $DESTINO"
          xcodebuild test \
            -project app-ios/Custta.xcodeproj \
            -scheme Custta \
            -destination "$DESTINO" \
            -derivedDataPath app-ios/build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$RUNNER_TEMP/testes-etapa3-b.xcresult" \
            -only-testing:CusttaUITests/DetalheDoTopicoUITests \
            CODE_SIGNING_ALLOWED=NO

      # Tela reprovada: o resultado dos testes fica 7 dias no artefato, também quando o job é cortado no teto.
      - name: Resultado dos testes da etapa 3 (parte b) quando reprovam ou o job é cortado
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testes-etapa3-b-app-ios
          path: ${{ runner.temp }}/testes-etapa3-b.xcresult
          retention-days: 7

  app-etapa3-c:
    runs-on: macos-26
    # Os testes de tela do PR 3 da etapa 3, que não cabem no app-etapa3-b: com eles (~22 min de testes no run
    # 39878786962), ele chegaria a ~50 min. No PR 3, o BuscaUITests e o AfazeresUITests. O mesmo preparo do app-etapa3, em
    # paralelo com ele. Teto de 60, como o do app-etapa3-b; como no app-etapa3, cada PR da etapa anota aqui o tempo do job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Versão do Xcode
        run: xcodebuild -version

      # Os mesmos serviços falsos do job app, que pula estas suítes.
      - name: Testes de tela da etapa 3 no simulador (parte c)
        run: |
          set -o pipefail
          DESTINO="$(node scripts/simulador-ios.mjs)"
          echo "Simulador: $DESTINO"
          xcodebuild test \
            -project app-ios/Custta.xcodeproj \
            -scheme Custta \
            -destination "$DESTINO" \
            -derivedDataPath app-ios/build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$RUNNER_TEMP/testes-etapa3-c.xcresult" \
            -only-testing:CusttaUITests/BuscaUITests \
            -only-testing:CusttaUITests/AfazeresUITests \
            CODE_SIGNING_ALLOWED=NO

      # Tela reprovada: o resultado dos testes fica 7 dias no artefato, também quando o job é cortado no teto.
      - name: Resultado dos testes da etapa 3 (parte c) quando reprovam ou o job é cortado
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testes-etapa3-c-app-ios
          path: ${{ runner.temp }}/testes-etapa3-c.xcresult
          retention-days: 7

  laudo:
    if: false  # temporário: o run das sondas roda só o app-etapa3-c
    runs-on: macos-26
    # Leitura e auditorias em dois jobs que levam o mesmo tempo. Num job só (c1bc06a, 15/10): leitura 2089 s, auditorias
    # 718 s e ~7 min de build e simulador, 54 min; a folha do gasto soma ~1150 s de leitura e ~320 s de auditoria (perto
    # do dobro do Mac), 75–79 min. A leitura da folha, a mais pesada, roda no job auditoria: ~35 min de testes e ~43 min de
    # job em cada um. Teto de 60 min; se um passar de ~50, mova uma leitura para o outro (-skip-testing aqui e
    # -only-testing lá). No fim do PR 2 o laudo já usava perto de 50 min, e a parte 3 da etapa 2 soma ~30 cenas: as
    # leituras dela rodam no job laudo-parte3, e as auditorias dela também (~7 min na CI, o auditoria ia a ~50). No fim do
    # PR 2 da etapa 3, 33,6 min, com 24,2 de leitura (run 40125911713).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Versão do Xcode
        run: xcodebuild -version

      # O laudo de leitura sobre o vidro (LeituraNoVidroUITests) é portão aqui também: o simulador da máquina virtual
      # desenha o vidro diferente do Mac, mas igual de uma rodada para outra. A lista sob a cápsula de abas é medida só
      # em 0, 20, 40 e 260 pt (a varredura completa fica no Mac). A leitura da folha do gasto roda no job auditoria, e
      # as da parte 3, no laudo-parte3.
      - name: Laudo de leitura no simulador
        env:
          TEST_RUNNER_CUSTTA_VARREDURA: curta
        run: |
          set -o pipefail
          DESTINO="$(node scripts/simulador-ios.mjs)"
          echo "Simulador: $DESTINO"
          xcodebuild test \
            -project app-ios/Custta.xcodeproj \
            -scheme Custta \
            -destination "$DESTINO" \
            -derivedDataPath app-ios/build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$RUNNER_TEMP/laudo.xcresult" \
            -only-testing:CusttaUITests/LeituraNoVidroUITests \
            -skip-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDaFolhaDoGasto \
            -skip-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDaParte3 \
            -skip-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDaObraVendida \
            -skip-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDaParte3NaMaiorLetra \
            -skip-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDoAlertaDeNaoSalvou \
            -skip-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDoOrcamento \
            -skip-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDoOrcamentoNaMaiorLetra \
            -skip-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDasFolhasDeOrigem \
            -skip-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDasFolhasDeOrigemNaMaiorLetra \
            CODE_SIGNING_ALLOWED=NO

      # Laudo reprovado: o resultado e os prints anotados ficam 7 dias no artefato (o log só traz as notas).
      - name: Resultado do laudo quando reprova
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: laudo-app-ios
          path: ${{ runner.temp }}/laudo.xcresult
          retention-days: 7

  laudo-parte3:
    if: false  # temporário: o run das sondas roda só o app-etapa3-c
    runs-on: macos-26
    # As leituras e as auditorias da parte 3 da etapa 2: as ações da fase, a lista vazia, as folhas da obra e da venda,
    # o gasto numa vendida, a obra vendida com lucro e com prejuízo e o alerta de "Não salvou". A conta do tempo está
    # no job laudo.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Versão do Xcode
        run: xcodebuild -version

      # A mesma varredura curta do job laudo: uma leitura troca de job sem mudar o que mede.
      - name: Laudo de leitura e auditorias da parte 3 no simulador
        env:
          TEST_RUNNER_CUSTTA_VARREDURA: curta
        run: |
          set -o pipefail
          DESTINO="$(node scripts/simulador-ios.mjs)"
          echo "Simulador: $DESTINO"
          xcodebuild test \
            -project app-ios/Custta.xcodeproj \
            -scheme Custta \
            -destination "$DESTINO" \
            -derivedDataPath app-ios/build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$RUNNER_TEMP/laudo-parte3.xcresult" \
            -only-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDaParte3 \
            -only-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDaObraVendida \
            -only-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDaParte3NaMaiorLetra \
            -only-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDoAlertaDeNaoSalvou \
            -only-testing:CusttaUITests/AuditoriaUITests/testParte3NoMaiorTamanho \
            -only-testing:CusttaUITests/AuditoriaUITests/testContrasteDaParte3NosDoisTemas \
            CODE_SIGNING_ALLOWED=NO

      # Laudo reprovado: o resultado e os prints anotados ficam 7 dias no artefato (o log só traz as notas).
      - name: Resultado do laudo da parte 3 quando reprova
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: laudo-parte3-app-ios
          path: ${{ runner.temp }}/laudo-parte3.xcresult
          retention-days: 7

  laudo-etapa3:
    if: false  # temporário: o run das sondas roda só o app-etapa3-c
    runs-on: macos-26
    # As leituras e as auditorias das telas da etapa 3 do app nativo (conselho de 19/10, decisão 3: o job nasce com elas, sem
    # esperar um job passar de ~50 min). No PR 1, o orçamento: a linha na obra, a tela Orçamento e a folha com as teclas
    # encaixadas, no escuro, no claro e na maior letra. No PR 2, as folhas de origem (o A pagar e o detalhe do tópico), no
    # escuro e no claro (~20 cenas): 38,7 min no run 40108043199. E a maior letra e as auditorias delas: 5,5 min no Mac,
    # 13,6 na CI, e o job foi a 52 min (run 40125911713), com teto de 60. Cada PR da etapa anota aqui o tempo do job; o PR 3
    # já não cabe e abre o laudo-etapa3-b (como o app-etapa3-b), que começa com estas três.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Versão do Xcode
        run: xcodebuild -version

      # A mesma varredura curta do job laudo: uma leitura troca de job sem mudar o que mede.
      - name: Laudo de leitura e auditorias da etapa 3 no simulador
        env:
          TEST_RUNNER_CUSTTA_VARREDURA: curta
        run: |
          set -o pipefail
          DESTINO="$(node scripts/simulador-ios.mjs)"
          echo "Simulador: $DESTINO"
          xcodebuild test \
            -project app-ios/Custta.xcodeproj \
            -scheme Custta \
            -destination "$DESTINO" \
            -derivedDataPath app-ios/build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$RUNNER_TEMP/laudo-etapa3.xcresult" \
            -only-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDoOrcamento \
            -only-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDoOrcamentoNaMaiorLetra \
            -only-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDasFolhasDeOrigem \
            -only-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDasFolhasDeOrigemNaMaiorLetra \
            -only-testing:CusttaUITests/AuditoriaUITests/testOrcamentoNoMaiorTamanho \
            -only-testing:CusttaUITests/AuditoriaUITests/testContrasteDoOrcamentoNosDoisTemas \
            -only-testing:CusttaUITests/AuditoriaUITests/testFolhasDeOrigemNoMaiorTamanho \
            -only-testing:CusttaUITests/AuditoriaUITests/testContrasteDasFolhasDeOrigemNosDoisTemas \
            CODE_SIGNING_ALLOWED=NO

      # Laudo reprovado: o resultado e os prints anotados ficam 7 dias no artefato (o log só traz as notas).
      - name: Resultado do laudo da etapa 3 quando reprova
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: laudo-etapa3-app-ios
          path: ${{ runner.temp }}/laudo-etapa3.xcresult
          retention-days: 7

  auditoria:
    if: false  # temporário: o run das sondas roda só o app-etapa3-c
    runs-on: macos-26
    # As auditorias de acessibilidade (as da parte 3 rodam no laudo-parte3, e as da etapa 3, no laudo-etapa3) e a leitura
    # da folha do gasto; a conta do tempo está no job laudo. No fim do PR 2 da etapa 3, 37,8 min: as 14 auditorias em 19,1
    # e a leitura em 11,2 (run 40125911713).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Versão do Xcode
        run: xcodebuild -version

      # A mesma varredura curta do job laudo: uma leitura troca de job sem mudar o que mede.
      - name: Auditorias de acessibilidade e leitura da folha do gasto no simulador
        env:
          TEST_RUNNER_CUSTTA_VARREDURA: curta
        run: |
          set -o pipefail
          DESTINO="$(node scripts/simulador-ios.mjs)"
          echo "Simulador: $DESTINO"
          xcodebuild test \
            -project app-ios/Custta.xcodeproj \
            -scheme Custta \
            -destination "$DESTINO" \
            -derivedDataPath app-ios/build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$RUNNER_TEMP/auditoria.xcresult" \
            -only-testing:CusttaUITests/AuditoriaUITests \
            -skip-testing:CusttaUITests/AuditoriaUITests/testParte3NoMaiorTamanho \
            -skip-testing:CusttaUITests/AuditoriaUITests/testContrasteDaParte3NosDoisTemas \
            -skip-testing:CusttaUITests/AuditoriaUITests/testOrcamentoNoMaiorTamanho \
            -skip-testing:CusttaUITests/AuditoriaUITests/testContrasteDoOrcamentoNosDoisTemas \
            -skip-testing:CusttaUITests/AuditoriaUITests/testFolhasDeOrigemNoMaiorTamanho \
            -skip-testing:CusttaUITests/AuditoriaUITests/testContrasteDasFolhasDeOrigemNosDoisTemas \
            -only-testing:CusttaUITests/LeituraNoVidroUITests/testLeituraDaFolhaDoGasto \
            CODE_SIGNING_ALLOWED=NO

      # Auditoria ou leitura reprovadas: o resultado e os prints anotados ficam 7 dias no artefato.
      - name: Resultado das auditorias quando reprovam
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auditoria-app-ios
          path: ${{ runner.temp }}/auditoria.xcresult
          retention-days: 7
