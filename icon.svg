<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ícone do Custta: o pórtico — duas colunas e uma viga, o mesmo desenho
       dos dois "t" do logotipo e do ícone `portico` em icons.js. A geometria é
       a mesma malha de 24, só ampliada: viga alta e colunas longas embaixo, que
       é o que separa o pórtico de um "H". Sangra até a borda de propósito — o
       manifest declara purpose "any maskable", então quem recorta é o sistema. -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#14B39A"/>
      <stop offset="0.52" stop-color="#0D8577"/>
      <stop offset="1" stop-color="#0A3F30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#3AD17E" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3AD17E" stop-opacity="0"/>
    </radialGradient>
    <!-- planta baixa: mesma malha da splash, quase imperceptível -->
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#EAFFF6" stroke-opacity="0.055" stroke-width="2"/>
    </pattern>
    <filter id="sombra" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#04100C" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Cabe no círculo central de 80% que as máscaras preservam: o ponto mais
       distante do centro fica a 177px, e o limite seguro é 205px. -->
  <g transform="translate(256 256) scale(14) translate(-12 -12)"
     fill="none" stroke="#EAFFF6" stroke-width="2.4"
     stroke-linecap="round" filter="url(#sombra)">
    <path d="M4.5 9h15"/>
    <path d="M8.5 4v16"/>
    <path d="M15.5 4v16"/>
  </g>
</svg>
